name: Validate SDK

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run typecheck
      - run: npm test --workspace @gamedevland/engine
      - run: npm run test:three-texture
      - run: npm run test:renderers
      - run: npm run test:archive-dependency
      - run: npm run test:stability
      - run: npm run test:audio
      - run: npm run test:locales
      - run: npm run test:crazygames
      - run: npm run test:playgama
      - run: npm run test:project-template
      - run: npm run test:resource-cleanup --workspace @gamedevland/engine
      - run: npm run test:screen --workspace @gamedevland/engine
      - run: npm test --workspace @gamedevland/vite
      - run: npm pack --dry-run --workspace @gamedevland/engine
      - run: npm pack --dry-run --workspace @gamedevland/vite
