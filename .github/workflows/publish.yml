name: Publish npm packages

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish packages to npm after validation
        required: true
        type: boolean
        default: false
      package:
        description: Package to release
        required: true
        type: choice
        default: all
        options:
          - all
          - engine
          - vite

permissions:
  contents: read
  id-token: write

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Require public source for npm publication
        if: inputs.publish
        env:
          REPOSITORY_PRIVATE: ${{ github.event.repository.private }}
          RELEASE_REF: ${{ github.ref }}
        run: |
          if [ "$REPOSITORY_PRIVATE" != "false" ] || [ "$RELEASE_REF" != "refs/heads/main" ]; then
            echo "::error::Publish only from main with a public source repository."
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Update npm
        run: npm install --global npm@latest

      - name: Install dependencies
        run: npm ci

      - name: Build engine
        run: npm run build --workspace @gamedevland/engine

      - name: Build Vite integration
        run: npm run build --workspace @gamedevland/vite

      - name: Inspect engine package
        run: npm pack --dry-run --workspace @gamedevland/engine

      - name: Test engine resource cleanup
        run: npm run test:resource-cleanup --workspace @gamedevland/engine

      - name: Test shared tooling
        run: npm test --workspace @gamedevland/vite

      - name: Inspect Vite package
        run: npm pack --dry-run --workspace @gamedevland/vite

      - name: Publish engine
        if: inputs.publish && (inputs.package == 'all' || inputs.package == 'engine')
        run: npm publish --workspace @gamedevland/engine --access public

      - name: Publish Vite integration
        if: inputs.publish && (inputs.package == 'all' || inputs.package == 'vite')
        run: npm publish --workspace @gamedevland/vite --access public
